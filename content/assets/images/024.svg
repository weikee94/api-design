<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344"
     role="img" aria-labelledby="t d">
<title id="t">Client-side rendering — how the browser builds the page</title>
<desc id="d">The browser sends an HTTP request to the web server. The server responds with a document containing minimal HTML and JavaScript links. The browser parses the HTML into a DOM of HTML, Body, H1, Link and Script nodes. For the JavaScript, the browser evaluates the file and calls the DOM API; the DOM API updates the DOM. The browser then paints the DOM and the complete page is rendered. Nothing is visible to the user until that last step.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#eaeaea}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#1aa179} .okbg{fill:#e8f7f2;stroke:#1aa179}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#1e293b}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:12.5px;font-weight:600} .s{font-size:11px} .m{font-size:10.5px}
  .num{font-size:10px;font-weight:700}
</style>
<rect class="bg" width="720" height="344"/>
<text class="h mut" x="24" y="28">CSR · HOW THE BROWSER BUILDS THE PAGE</text>

<rect class="card" x="24"  y="48" width="152" height="52" rx="8" stroke-width="1"/>
<text class="n ink" x="100" y="72" text-anchor="middle">Browser</text>
<text class="m mut" x="100" y="88" text-anchor="middle">nothing to show yet</text>

<rect class="card" x="544" y="48" width="152" height="52" rx="8" stroke-width="1"/>
<text class="n ink" x="620" y="72" text-anchor="middle">Web server</text>

<path class="line" d="M180 66 L540 66" stroke-width="1.4" marker-end="url(#a)"/>
<text class="m mut" x="360" y="60" text-anchor="middle">1 · HTTP request</text>
<path class="line" d="M540 88 L180 88" stroke-width="1.4" marker-end="url(#a)"/>
<text class="m mut" x="360" y="104" text-anchor="middle">2 · minimal HTML + JavaScript links</text>

<path class="line" d="M100 100 L100 132" stroke-width="1.4" marker-end="url(#a)"/>
<text class="m mut" x="112" y="120">3 · parse the HTML</text>

<rect class="card" x="24" y="136" width="152" height="88" rx="8" stroke-width="1"/>
<text class="s ink" x="100" y="158" text-anchor="middle">DOM</text>
<rect class="card" x="76" y="166" width="48" height="16" rx="4" stroke-width="1"/>
<text class="m mut" x="100" y="178" text-anchor="middle">HTML</text>
<rect class="card" x="76" y="188" width="48" height="16" rx="4" stroke-width="1"/>
<text class="m mut" x="100" y="200" text-anchor="middle">Body</text>
<text class="m mut" x="100" y="218" text-anchor="middle">H1 · Link · Script</text>

<rect class="accbg" x="504" y="152" width="192" height="56" rx="8" stroke-width="1.5"/>
<text class="n ink" x="600" y="176" text-anchor="middle">DOM API</text>
<text class="m accf" x="600" y="194" text-anchor="middle">called by the evaluated script</text>

<path class="acc" d="M176 148 L500 168" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text class="m accf" x="340" y="146" text-anchor="middle">4 · browser evaluates the JavaScript file</text>

<path class="acc" d="M500 196 L180 196" stroke-width="1.4" marker-end="url(#a)"/>
<text class="m accf" x="340" y="212" text-anchor="middle">5 · the DOM API updates the DOM</text>

<path class="ok" d="M100 224 L100 256" stroke-width="1.4" marker-end="url(#a)"/>
<text class="m okf" x="112" y="244">6 · paints the DOM</text>

<rect class="okbg" x="24" y="260" width="264" height="48" rx="8" stroke-width="1.5"/>
<text class="n ink" x="156" y="282" text-anchor="middle">Complete page is rendered</text>
<text class="m okf" x="156" y="298" text-anchor="middle">first moment the user sees anything</text>

<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker>
</defs>
</svg>
