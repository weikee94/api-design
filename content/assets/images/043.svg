<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" aria-labelledby="t d">
<title id="t">Cache miss, then cache hit</title>
<desc id="d">The first request goes from the client to the cache, which is empty, so it is a miss and the cache forwards the request to the server. The server responds, the cache saves a copy, and the response goes back to the client. When the same request comes again, the cache already has the copy: it is a hit, the response is served straight from the cache, and the server is not called at all. The expensive work happens once and every repeat is answered by the copy.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179} .okdot{fill:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .bad{stroke:#b5746e} .badf{fill:#a35d57} .badbg{fill:#f6ecea;stroke:#b5746e} .baddot{fill:#b5746e} .band{fill:#b5746e;fill-opacity:.14}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399} .okdot{fill:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .bad{stroke:#fb7185} .badf{fill:#fb7185} .badbg{fill:#3f152f;stroke:#fb7185} .baddot{fill:#fb7185} .band{fill:#fb7185;fill-opacity:.18}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
  .mono{font-size:10px;font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" width="720" height="272"/>
<text class="h mut" x="24" y="24">CACHE · THE SECOND REQUEST NEVER REACHES THE SERVER</text>
<text class="s ink" x="24" y="52">first request — miss</text>
<rect class="card" x="24" y="64" width="120" height="44" rx="8" stroke-width="1.3"/><text class="n ink" x="84" y="90" text-anchor="middle">Client</text>
<rect class="ambbg" x="300" y="64" width="120" height="44" rx="8" stroke-width="1.3"/><text class="n ink" x="360" y="84" text-anchor="middle">Cache</text><text class="m mut" x="360" y="99" text-anchor="middle">empty</text>
<rect class="card" x="576" y="64" width="120" height="44" rx="8" stroke-width="1.3"/><text class="n ink" x="636" y="90" text-anchor="middle">Server</text>
<path class="line" d="M148 78 L296 78" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="222" y="72" text-anchor="middle">request</text>
<path class="amb" d="M424 78 L572 78" stroke-width="1.3" marker-end="url(#a)"/><text class="m ambf" x="498" y="72" text-anchor="middle">miss — forward it</text>
<path class="line" d="M572 96 L424 96" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="498" y="112" text-anchor="middle">response + save a copy</text>
<path class="line" d="M296 96 L148 96" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="222" y="112" text-anchor="middle">response</text>
<text class="s ink" x="24" y="160">same request again — hit</text>
<rect class="card" x="24" y="172" width="120" height="44" rx="8" stroke-width="1.3"/><text class="n ink" x="84" y="198" text-anchor="middle">Client</text>
<rect class="okbg" x="300" y="172" width="120" height="44" rx="8" stroke-width="1.3"/><text class="n ink" x="360" y="192" text-anchor="middle">Cache</text><text class="m mut" x="360" y="207" text-anchor="middle">has the copy</text>
<rect class="card" x="576" y="172" width="120" height="44" rx="8" stroke-width="1.3" stroke-dasharray="4 3"/><text class="n ink" x="636" y="192" text-anchor="middle">Server</text><text class="m mut" x="636" y="207" text-anchor="middle">not called</text>
<path class="line" d="M148 186 L296 186" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="222" y="180" text-anchor="middle">same request</text>
<path class="ok" d="M296 204 L148 204" stroke-width="1.3" marker-end="url(#a)"/><text class="m okf" x="222" y="220" text-anchor="middle">hit — served from the cache</text>
<text class="m mut" x="24" y="256">the database read, the network hop and the server computation happen once — every repeat is answered by the copy</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
