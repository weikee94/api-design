<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272"
     role="img" aria-labelledby="t d">
<title id="t">One server, four services, four ports</title>
<desc id="d">Four different clients each contact the same server. A client at 10.1.y.z port 50625 is sending email and reaches SMTP on port 587. A client at 10.2.y.z port 54043 is browsing a website and reaches HTTPS on port 443. A client at 10.3.y.z port 52134 is uploading media and reaches FTP on port 21. A client at 10.4.y.z port 56432 is requesting a database and reaches PostgreSQL on port 5432. All four land on the single server address 104.18.2.119, which serves different requests on different ports.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .cli{fill:#ffffff;stroke:#c9c9c9} .svc{fill:#eef4ff;stroke:#0070f3}
  .srv{fill:#f4faf7;stroke:#1aa179} .acc{stroke:#0070f3}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .cli{fill:#0b1220;stroke:#475569} .svc{fill:#0c2134;stroke:#60a5fa}
    .srv{fill:#0b2c31;stroke:#34d399} .acc{stroke:#60a5fa}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11px;font-weight:600} .m{font-size:9.5px} .mono{font-size:10px;font-family:ui-monospace,monospace}
</style>
<rect class="bg" width="720" height="272"/>
<text class="h mut" x="24" y="24">ONE SERVER ADDRESS · FOUR PORTS · FOUR SERVICES</text>
<rect class="cli" x="24" y="44" width="144" height="52" rx="6" stroke-width="1"/>
<text class="mono ink" x="96" y="62" text-anchor="middle">10.1.y.z:50625</text>
<text class="m mut" x="96" y="82" text-anchor="middle">sending email</text>
<path class="acc" d="M96 96 L96 128" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="svc" x="40" y="132" width="112" height="32" rx="5" stroke-width="1.3"/>
<text class="n ink" x="96" y="153" text-anchor="middle">SMTP :587</text>
<path class="line" d="M96 164 L96 196" stroke-width="1.3"/>
<rect class="cli" x="200" y="44" width="144" height="52" rx="6" stroke-width="1"/>
<text class="mono ink" x="272" y="62" text-anchor="middle">10.2.y.z:54043</text>
<text class="m mut" x="272" y="82" text-anchor="middle">browsing a website</text>
<path class="acc" d="M272 96 L272 128" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="svc" x="216" y="132" width="112" height="32" rx="5" stroke-width="1.3"/>
<text class="n ink" x="272" y="153" text-anchor="middle">HTTPS :443</text>
<path class="line" d="M272 164 L272 196" stroke-width="1.3"/>
<rect class="cli" x="376" y="44" width="144" height="52" rx="6" stroke-width="1"/>
<text class="mono ink" x="448" y="62" text-anchor="middle">10.3.y.z:52134</text>
<text class="m mut" x="448" y="82" text-anchor="middle">uploading media</text>
<path class="acc" d="M448 96 L448 128" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="svc" x="392" y="132" width="112" height="32" rx="5" stroke-width="1.3"/>
<text class="n ink" x="448" y="153" text-anchor="middle">FTP :21</text>
<path class="line" d="M448 164 L448 196" stroke-width="1.3"/>
<rect class="cli" x="552" y="44" width="144" height="52" rx="6" stroke-width="1"/>
<text class="mono ink" x="624" y="62" text-anchor="middle">10.4.y.z:56432</text>
<text class="m mut" x="624" y="82" text-anchor="middle">requesting a database</text>
<path class="acc" d="M624 96 L624 128" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="svc" x="568" y="132" width="112" height="32" rx="5" stroke-width="1.3"/>
<text class="n ink" x="624" y="153" text-anchor="middle">PostgreSQL :5432</text>
<path class="line" d="M624 164 L624 196" stroke-width="1.3"/>
<line class="line" x1="96" y1="196" x2="624" y2="196" stroke-width="1.3"/>
<rect class="srv" x="248" y="204" width="224" height="40" rx="6" stroke-width="1.3"/>
<text class="n ink" x="360" y="221" text-anchor="middle">one server</text>
<text class="mono mut" x="360" y="237" text-anchor="middle">104.18.2.119</text>
<text class="m mut" x="24" y="264">same address for all four — the port is what tells the machine which service the request is for</text>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
  <path d="M0,0 L6,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
</svg>
