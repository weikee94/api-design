<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288"
     role="img" aria-labelledby="t d">
<title id="t">Static loading versus dynamic loading</title>
<desc id="d">Two views of the same page layout, each with a header, a sidebar and a grid of content tiles. On the left, static loading reloads everything on the page: every block is tinted to show it was re-fetched. On the right, dynamic loading leaves the header and sidebar untouched and updates only the content grid, which is outlined and tinted. This is what selective re-rendering of specific DOM elements without a full page reload means.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .frame{fill:none;stroke:#eaeaea}
  .ink{fill:#111111} .mut{fill:#8a8f98}
  .tile{fill:#f4f4f5;stroke:#e4e4e7}
  .hot{fill:#f6ecea;stroke:#b5746e} .hotf{fill:#b5746e} .hotline{stroke:#b5746e}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .frame{fill:none;stroke:#1e293b}
    .ink{fill:#ffffff} .mut{fill:#94a3b8}
    .tile{fill:#0f172a;stroke:#1e293b}
    .hot{fill:#3f152f;stroke:#fb7185} .hotf{fill:#fb7185} .hotline{stroke:#fb7185}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .s{font-size:11px} .m{font-size:10.5px}
</style>
<rect class="bg" width="720" height="288"/>
<text class="h mut" x="24" y="28">WHAT ACTUALLY RE-RENDERS</text>

<!-- left: static loading — everything reloads -->
<rect class="frame" x="24" y="48" width="320" height="176" rx="8" stroke-width="1"/>
<rect class="hot" x="36" y="64" width="44" height="16" rx="3" stroke-width="1"/>
<rect class="hot" x="88" y="64" width="236" height="16" rx="3" stroke-width="1"/>
<rect class="hot" x="36" y="92" width="60" height="112" rx="3" stroke-width="1"/>
<text class="m hotf" x="66" y="152" text-anchor="middle">side bar</text>
<rect class="hot" x="104" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="180" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="256" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="104" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="180" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="256" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<text class="s ink" x="184" y="248" text-anchor="middle">Static loading</text>
<text class="m mut" x="184" y="266" text-anchor="middle">reloads everything on the page</text>

<!-- right: dynamic loading — only the grid updates -->
<rect class="frame" x="376" y="48" width="320" height="176" rx="8" stroke-width="1"/>
<rect class="tile" x="388" y="64" width="44" height="16" rx="3" stroke-width="1"/>
<rect class="tile" x="440" y="64" width="236" height="16" rx="3" stroke-width="1"/>
<rect class="tile" x="388" y="92" width="60" height="112" rx="3" stroke-width="1"/>
<text class="m mut" x="418" y="152" text-anchor="middle">side bar</text>
<rect class="hot" x="456" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="532" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="608" y="92"  width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="456" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="532" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hot" x="608" y="152" width="68" height="52" rx="3" stroke-width="1"/>
<rect class="hotline" fill="none" x="452" y="84" width="228" height="128" rx="5" stroke-width="1.6" stroke-dasharray="5 4"/>
<text class="s ink" x="536" y="248" text-anchor="middle">Dynamic loading</text>
<text class="m mut" x="536" y="266" text-anchor="middle">updates only the outlined area</text>

<rect class="hot" x="24" y="272" width="10" height="10" rx="2" stroke-width="1"/>
<text class="m mut" x="40" y="281">tinted = re-fetched and re-rendered</text>
</svg>
