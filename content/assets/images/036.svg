<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" role="img" aria-labelledby="t d">
<title id="t">The web page load process, from DNS to rendering</title>
<desc id="d">The browser resolves the server's address with DNS, sends an HTTP request, and receives the HTML: a complete document under SSR or a shell with JavaScript links under CSR. It parses the HTML; whenever the parser meets a script or link tag it halts, runs that JavaScript or CSS, and then resumes, and each halt delays the page. Parsing produces the DOM tree, the browser turns it into a layout tree, and the layout tree is rendered as pixels on screen.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .bad{stroke:#b5746e} .badf{fill:#a35d57} .badbg{fill:#f6ecea;stroke:#b5746e}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .bad{stroke:#fb7185} .badf{fill:#fb7185} .badbg{fill:#3f152f;stroke:#fb7185}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
</style>
<rect class="bg" width="720" height="232"/>
<text class="h mut" x="24" y="24">WEB PAGE LOAD · FROM DNS TO RENDERING</text>
<rect class="card" x="16" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="60" y="70" text-anchor="middle">DNS lookup</text>
<text class="m mut" x="60" y="86" text-anchor="middle">find the server</text>
<path class="line" d="M106 72 L114 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="card" x="116" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="160" y="70" text-anchor="middle">HTTP request</text>
<text class="m mut" x="160" y="86" text-anchor="middle">to the server</text>
<path class="line" d="M206 72 L214 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="card" x="216" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="260" y="70" text-anchor="middle">HTML arrives</text>
<text class="m mut" x="260" y="86" text-anchor="middle">full doc or shell</text>
<path class="line" d="M306 72 L314 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="ambbg" x="316" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="360" y="70" text-anchor="middle">Parse HTML</text>
<text class="m ambf" x="360" y="86" text-anchor="middle">can halt ↓</text>
<path class="line" d="M406 72 L414 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="card" x="416" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="460" y="70" text-anchor="middle">DOM tree</text>
<text class="m mut" x="460" y="86" text-anchor="middle">built by parsing</text>
<path class="line" d="M506 72 L514 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="card" x="516" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="560" y="70" text-anchor="middle">Layout tree</text>
<text class="m mut" x="560" y="86" text-anchor="middle">positions</text>
<path class="line" d="M606 72 L614 72" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="616" y="48" width="88" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="660" y="70" text-anchor="middle">Rendered</text>
<text class="m mut" x="660" y="86" text-anchor="middle">on screen</text>
<rect class="ambbg" x="276" y="140" width="168" height="48" rx="8" stroke-width="1.2"/>
<text class="n ink" x="360" y="161" text-anchor="middle">parser halts</text>
<text class="m ambf" x="360" y="177" text-anchor="middle">runs the JavaScript or CSS</text>
<path class="amb" d="M344 96 L344 136" stroke-width="1.3" marker-end="url(#a)"/>
<text class="m ambf" x="336" y="120" text-anchor="end">meets &lt;script&gt; / &lt;link&gt;</text>
<path class="amb" d="M376 140 L376 100" stroke-width="1.3" marker-end="url(#a)"/>
<text class="m ambf" x="384" y="120">resumes</text>
<text class="m mut" x="24" y="220">every halt delays the page · the finished DOM becomes a layout tree, which is painted</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
