<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" width="720" height="216" role="img" aria-labelledby="t d">
<title id="t">Exponential backoff — the wait multiplies after each failure</title>
<desc id="d">One client retries a failing request. The wait before each retry is m to the power c, where m is the multiplication factor, here 2, and c is how many times the failure has happened so far. So the gaps between tries one to five are 1, 2, 4 and 8 units long, visibly doubling along the time axis. The first four tries fail and the fifth succeeds. Each failure multiplies the wait, so the client backs off instead of hammering a struggling service.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179} .okdot{fill:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .bad{stroke:#b5746e} .badf{fill:#a35d57} .badbg{fill:#f6ecea;stroke:#b5746e} .baddot{fill:#b5746e} .band{fill:#b5746e;fill-opacity:.14}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399} .okdot{fill:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .bad{stroke:#fb7185} .badf{fill:#fb7185} .badbg{fill:#3f152f;stroke:#fb7185} .baddot{fill:#fb7185} .band{fill:#fb7185;fill-opacity:.18}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
  .mono{font-size:10px;font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" width="720" height="216"/>
<text class="h mut" x="24" y="24">EXPONENTIAL BACKOFF · TIME = m^c</text>
<path class="line" d="M40 112 L690 112" stroke-width="1.2" marker-end="url(#a)"/>
<text class="m mut" x="690" y="132" text-anchor="end">time</text>
<text class="m mut" x="48" y="90" text-anchor="middle">try 1</text>
<circle class="badbg" cx="48" cy="112" r="9" stroke-width="1.4"/><path class="bad" d="M44 108 L52 116 M52 108 L44 116" stroke-width="2"/>
<text class="m mut" x="88" y="90" text-anchor="middle">try 2</text>
<circle class="badbg" cx="88" cy="112" r="9" stroke-width="1.4"/><path class="bad" d="M84 108 L92 116 M92 108 L84 116" stroke-width="2"/>
<text class="m mut" x="168" y="90" text-anchor="middle">try 3</text>
<circle class="badbg" cx="168" cy="112" r="9" stroke-width="1.4"/><path class="bad" d="M164 108 L172 116 M172 108 L164 116" stroke-width="2"/>
<text class="m mut" x="328" y="90" text-anchor="middle">try 4</text>
<circle class="badbg" cx="328" cy="112" r="9" stroke-width="1.4"/><path class="bad" d="M324 108 L332 116 M332 108 L324 116" stroke-width="2"/>
<text class="m mut" x="648" y="90" text-anchor="middle">try 5</text>
<circle class="okbg" cx="648" cy="112" r="9" stroke-width="1.4"/><path class="ok" d="M644 112 L647 115 L653 108" fill="none" stroke-width="2"/>
<path class="amb" d="M59 128 L59 134 L77 134 L77 128" fill="none" stroke-width="1.3"/>
<text class="m ambf" x="68" y="150" text-anchor="middle">m⁰=1</text>
<path class="amb" d="M99 128 L99 134 L157 134 L157 128" fill="none" stroke-width="1.3"/>
<text class="m ambf" x="128" y="150" text-anchor="middle">m¹=2</text>
<path class="amb" d="M179 128 L179 134 L317 134 L317 128" fill="none" stroke-width="1.3"/>
<text class="m ambf" x="248" y="150" text-anchor="middle">m²=4</text>
<path class="amb" d="M339 128 L339 134 L637 134 L637 128" fill="none" stroke-width="1.3"/>
<text class="m ambf" x="488" y="150" text-anchor="middle">m³=8</text>
<text class="m mut" x="24" y="184">m = multiplication factor (2 here) · c = how many times the failure has happened so far</text>
<text class="m mut" x="24" y="200">each failure multiplies the wait, so the client backs off instead of hammering a service that is already struggling</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
