<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" aria-labelledby="t d">
<title id="t">The four caching disciplines and the headers behind each</title>
<desc id="d">Four cards. Cacheability answers whether a response can be cached at all: no-store means it cannot, no-cache means it can but must be checked with the server first. Scope answers who may store it: private means only the client, public means the client, middleware and server. Expiration answers for how long: max-age is the number of seconds it stays fresh, s-maxage is the same for shared caches, and must-revalidate means that once stale it must be checked. Validation answers whether a copy is still current: ETag with If-None-Match compares by version id, Last-Modified with If-Modified-Since compares by time, and an unchanged resource gets 304 Not Modified. The first three are directives inside Cache-Control; validation uses its own pairs of headers.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
  .mono{font-size:10px;font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" width="720" height="316"/>
<text class="h mut" x="24" y="24">FOUR CACHING DISCIPLINES · THE QUESTION EACH ONE ANSWERS</text>
<rect class="accbg" x="24" y="48" width="328" height="108" rx="10" stroke-width="1.3"/>
<text class="n accf" x="40" y="70">Cacheability</text>
<text class="s ink" x="40" y="88">Can it be cached at all?</text>
<text class="mono ink" x="40" y="110">no-store — can’t be cached</text>
<text class="mono ink" x="40" y="125">no-cache — cached, but check with the server first</text>
<rect class="viobg" x="368" y="48" width="328" height="108" rx="10" stroke-width="1.3"/>
<text class="n viof" x="384" y="70">Scope</text>
<text class="s ink" x="384" y="88">Who may store it?</text>
<text class="mono ink" x="384" y="110">private — only the client</text>
<text class="mono ink" x="384" y="125">public — client, middleware and server</text>
<rect class="ambbg" x="24" y="172" width="328" height="108" rx="10" stroke-width="1.3"/>
<text class="n ambf" x="40" y="194">Expiration</text>
<text class="s ink" x="40" y="212">For how long?</text>
<text class="mono ink" x="40" y="234">max-age — seconds it stays fresh</text>
<text class="mono ink" x="40" y="249">s-maxage — the same, for shared caches</text>
<text class="mono ink" x="40" y="264">must-revalidate — once stale, must check</text>
<rect class="okbg" x="368" y="172" width="328" height="108" rx="10" stroke-width="1.3"/>
<text class="n okf" x="384" y="194">Validation</text>
<text class="s ink" x="384" y="212">Is my copy still current?</text>
<text class="mono ink" x="384" y="234">ETag + If-None-Match — by version id</text>
<text class="mono ink" x="384" y="249">Last-Modified + If-Modified-Since — by time</text>
<text class="mono ink" x="384" y="264">unchanged → 304 Not Modified</text>
<text class="m mut" x="24" y="300">the first three are directives inside Cache-Control · validation uses its own pairs of headers</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
