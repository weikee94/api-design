<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304"
     role="img" aria-labelledby="t d">
<title id="t">Server-side rendering — the path one page request takes</title>
<desc id="d">A page request goes to the server, the server builds the complete HTML document, and the populated document arrives so content is visible with no blank page. Every refresh loops back into the same build step and regenerates the whole document. Use it when a fast initial page load is critical and when SEO matters. Client-side rendering, the other approach, is covered in its own figures.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#eaeaea}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#1e293b}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:13px;font-weight:600} .s{font-size:11px} .m{font-size:10.5px}
</style>
<rect class="bg" width="720" height="304"/>
<text class="h mut" x="24" y="32">SSR · SERVER-SIDE RENDERING</text>

<rect class="card" x="24"  y="56" width="152" height="64" rx="8" stroke-width="1"/>
<text class="n ink" x="100" y="84"  text-anchor="middle">Page request</text>
<text class="m mut" x="100" y="102" text-anchor="middle">one page visit</text>

<rect class="card" x="208" y="56" width="192" height="64" rx="8" stroke-width="1"/>
<text class="n ink" x="304" y="84"  text-anchor="middle">Builds the whole document</text>
<text class="m mut" x="304" y="102" text-anchor="middle">rendered on the server</text>

<rect class="accbg" x="432" y="56" width="264" height="64" rx="8" stroke-width="1.5"/>
<text class="n ink" x="564" y="84"  text-anchor="middle">Populated document arrives</text>
<text class="m accf" x="564" y="102" text-anchor="middle">content visible · no blank page</text>

<path class="line" d="M180 88 L200 88" stroke-width="1.4" marker-end="url(#a)"/>
<path class="line" d="M404 88 L424 88" stroke-width="1.4" marker-end="url(#a)"/>

<path class="acc" d="M564 120 L564 164 Q564 172 556 172 L320 172 Q312 172 312 164 L312 128"
      stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="m accf" x="440" y="190" text-anchor="middle">refresh = the whole document is regenerated and sent again</text>

<line class="card" x1="24" y1="212" x2="696" y2="212" stroke-width="1"/>
<text class="h mut" x="24" y="240">WHEN TO USE</text>
<text class="s ink" x="24" y="264">fast initial page load is critical</text>
<circle class="accf" cx="200" cy="260" r="2"/>
<text class="s ink" x="216" y="264">SEO matters</text>

<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker>
</defs>
</svg>
