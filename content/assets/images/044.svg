<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-labelledby="t d">
<title id="t">LRU, LFU and MRU evict three different entries from the same cache</title>
<desc id="d">A cache holds A, B and C and a new entry D arrives, so one must be evicted. The access history is A, A, A, B, C, B at times t1 to t6. So A was last used at t3 and used three times, B last used at t6 and used twice, C last used at t5 and used once. LRU, least recently used, evicts A because it has been untouched longest. LFU, least frequently used, evicts C because it was used the fewest times. MRU, most recently used, evicts B because it was used most recently, which only makes sense if B will not be needed again. Same cache, same history, three different victims.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179} .okdot{fill:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .bad{stroke:#b5746e} .badf{fill:#a35d57} .badbg{fill:#f6ecea;stroke:#b5746e} .baddot{fill:#b5746e} .band{fill:#b5746e;fill-opacity:.14}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399} .okdot{fill:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .bad{stroke:#fb7185} .badf{fill:#fb7185} .badbg{fill:#3f152f;stroke:#fb7185} .baddot{fill:#fb7185} .band{fill:#fb7185;fill-opacity:.18}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
  .mono{font-size:10px;font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" width="720" height="332"/>
<text class="h mut" x="24" y="24">EVICTION · SAME CACHE, THREE POLICIES, THREE DIFFERENT VICTIMS</text>
<text class="s ink" x="24" y="48">The cache holds A, B and C. Then D arrives, so one of them has to go.</text>
<text class="m mut" x="24" y="88">accesses</text>
<rect class="card" x="120" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="148" y="88" text-anchor="middle">A</text>
<text class="m mut" x="148" y="114" text-anchor="middle">t1</text>
<path class="line" d="M178 83 L190 83" stroke-width="1" marker-end="url(#a)"/>
<rect class="card" x="192" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="220" y="88" text-anchor="middle">A</text>
<text class="m mut" x="220" y="114" text-anchor="middle">t2</text>
<path class="line" d="M250 83 L262 83" stroke-width="1" marker-end="url(#a)"/>
<rect class="card" x="264" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="292" y="88" text-anchor="middle">A</text>
<text class="m mut" x="292" y="114" text-anchor="middle">t3</text>
<path class="line" d="M322 83 L334 83" stroke-width="1" marker-end="url(#a)"/>
<rect class="card" x="336" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="364" y="88" text-anchor="middle">B</text>
<text class="m mut" x="364" y="114" text-anchor="middle">t4</text>
<path class="line" d="M394 83 L406 83" stroke-width="1" marker-end="url(#a)"/>
<rect class="card" x="408" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="436" y="88" text-anchor="middle">C</text>
<text class="m mut" x="436" y="114" text-anchor="middle">t5</text>
<path class="line" d="M466 83 L478 83" stroke-width="1" marker-end="url(#a)"/>
<rect class="card" x="480" y="68" width="56" height="30" rx="6" stroke-width="1.2"/><text class="n ink" x="508" y="88" text-anchor="middle">B</text>
<text class="m mut" x="508" y="114" text-anchor="middle">t6</text>
<rect class="card" x="120" y="132" width="160" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="200" y="151" text-anchor="middle">A</text><text class="m mut" x="200" y="166" text-anchor="middle">last used t3 · used 3×</text>
<rect class="card" x="296" y="132" width="160" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="376" y="151" text-anchor="middle">B</text><text class="m mut" x="376" y="166" text-anchor="middle">last used t6 · used 2×</text>
<rect class="card" x="472" y="132" width="160" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="552" y="151" text-anchor="middle">C</text><text class="m mut" x="552" y="166" text-anchor="middle">last used t5 · used 1×</text>
<text class="n ink" x="24" y="223">LRU — least recently used</text>
<path class="line" d="M224 219 L248 219" stroke-width="1.2" marker-end="url(#a)"/>
<rect class="badbg" x="256" y="204" width="84" height="28" rx="6" stroke-width="1.3"/><text class="n badf" x="298" y="223" text-anchor="middle">evicts A</text>
<text class="m mut" x="352" y="222">untouched for the longest time (t3)</text>
<text class="n ink" x="24" y="263">LFU — least frequently used</text>
<path class="line" d="M224 259 L248 259" stroke-width="1.2" marker-end="url(#a)"/>
<rect class="badbg" x="256" y="244" width="84" height="28" rx="6" stroke-width="1.3"/><text class="n badf" x="298" y="263" text-anchor="middle">evicts C</text>
<text class="m mut" x="352" y="262">used the fewest times (1×)</text>
<text class="n ink" x="24" y="303">MRU — most recently used</text>
<path class="line" d="M224 299 L248 299" stroke-width="1.2" marker-end="url(#a)"/>
<rect class="badbg" x="256" y="284" width="84" height="28" rx="6" stroke-width="1.3"/><text class="n badf" x="298" y="303" text-anchor="middle">evicts B</text>
<text class="m mut" x="352" y="302">used most recently (t6) — only if B won’t be needed again</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
