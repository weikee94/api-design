<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" width="720" height="264"
     role="img" aria-labelledby="t d">
<title id="t">The TCP/IP model — four layers, and one of them is a single choice</title>
<desc id="d">The application layer holds many protocols: HTTP, FTP, DNS and SMTP among others. The transport layer holds two, TCP and UDP. The internet layer holds one, IP, as either IPv4 or IPv6. The network access layer holds many again: Ethernet, ARP and other media protocols. Each row is drawn as wide as the number of choices it offers, so the internet layer is visibly the narrowest — that is the waist.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .box{fill:#ffffff;stroke:#8a8f98}
  .waist{fill:#eef4ff;stroke:#0070f3} .waistf{fill:#0070f3}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .box{fill:#0b1220;stroke:#94a3b8}
    .waist{fill:#0c2134;stroke:#60a5fa} .waistf{fill:#60a5fa}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11px;font-weight:600} .m{font-size:10.5px}
</style>
<rect class="bg" width="720" height="264"/>
<text class="h mut" x="24" y="24">TCP/IP · ROW WIDTH = HOW MANY CHOICES THAT LAYER OFFERS</text>

<rect class="box" x="24"  y="48" width="96" height="32" rx="5" stroke-width="1"/><text class="n ink" x="72"  y="69" text-anchor="middle">HTTP</text>
<rect class="box" x="128" y="48" width="96" height="32" rx="5" stroke-width="1"/><text class="n ink" x="176" y="69" text-anchor="middle">FTP</text>
<rect class="box" x="232" y="48" width="96" height="32" rx="5" stroke-width="1"/><text class="n ink" x="280" y="69" text-anchor="middle">DNS</text>
<text class="n mut" x="360" y="69" text-anchor="middle">· · ·</text>
<rect class="box" x="392" y="48" width="96" height="32" rx="5" stroke-width="1"/><text class="n ink" x="440" y="69" text-anchor="middle">SMTP</text>
<text class="m mut" x="520" y="69">application layer</text>

<rect class="box" x="128" y="96" width="136" height="32" rx="5" stroke-width="1"/><text class="n ink" x="196" y="117" text-anchor="middle">TCP</text>
<rect class="box" x="272" y="96" width="136" height="32" rx="5" stroke-width="1"/><text class="n ink" x="340" y="117" text-anchor="middle">UDP</text>
<text class="m mut" x="520" y="117">transport layer</text>

<rect class="waist" x="200" y="144" width="136" height="32" rx="5" stroke-width="1.6"/>
<text class="n ink" x="268" y="165" text-anchor="middle">IP — IPv4 or IPv6</text>
<text class="m waistf" x="520" y="165">internet layer — the waist</text>

<rect class="box" x="24"  y="192" width="112" height="32" rx="5" stroke-width="1"/><text class="n ink" x="80"  y="213" text-anchor="middle">Ethernet</text>
<rect class="box" x="144" y="192" width="112" height="32" rx="5" stroke-width="1"/><text class="n ink" x="200" y="213" text-anchor="middle">ARP</text>
<text class="n mut" x="288" y="213" text-anchor="middle">· · ·</text>
<rect class="box" x="320" y="192" width="168" height="32" rx="5" stroke-width="1"/><text class="n ink" x="404" y="213" text-anchor="middle">other media protocols</text>
<text class="m mut" x="520" y="213">network access layer</text>

<text class="m mut" x="24" y="250">many protocols above, many below, exactly one in the middle — everything has to pass through IP</text>
</svg>
