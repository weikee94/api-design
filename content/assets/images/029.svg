<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
     role="img" aria-labelledby="t d">
<title id="t">Layered architecture — protocols run sideways, interfaces run up and down</title>
<desc id="d">The same stack of layers exists on the client side and the server side. Between a layer and its peer on the other side runs a protocol, drawn horizontally. Between a layer and the layer above or below it on the same side runs an interface, drawn vertically: layer N provides services to layer N minus 1 and takes services from layer N plus 1. Only the bottom layers are physically connected; every higher protocol is a conversation carried over that one link.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#f4faf7;stroke:#1aa179}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  .pr{stroke:#0070f3} .prf{fill:#0070f3}
  .ifc{stroke:#e0a040} .ifcf{fill:#e0a040}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b2c31;stroke:#34d399}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
    .pr{stroke:#60a5fa} .prf{fill:#60a5fa}
    .ifc{stroke:#fbbf24} .ifcf{fill:#fbbf24}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .m{font-size:10px} .lbl{font-size:10.5px;font-weight:700}
</style>
<rect class="bg" width="720" height="320"/>
<text class="h mut" x="24" y="24">LAYERED ARCHITECTURE</text>
<text class="n ink" x="144" y="52" text-anchor="middle">Client side</text>
<text class="n ink" x="576" y="52" text-anchor="middle">Server side</text>

<rect class="card" x="64"  y="68"  width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="144" y="89" text-anchor="middle">Layer 1</text>
<rect class="card" x="496" y="68"  width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="576" y="89" text-anchor="middle">Layer 1</text>
<rect class="card" x="64"  y="120" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="144" y="141" text-anchor="middle">Layer 2</text>
<rect class="card" x="496" y="120" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="576" y="141" text-anchor="middle">Layer 2</text>
<text class="n mut" x="144" y="180" text-anchor="middle">⋮</text>
<text class="n mut" x="576" y="180" text-anchor="middle">⋮</text>
<rect class="card" x="64"  y="196" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="144" y="217" text-anchor="middle">Layer n</text>
<rect class="card" x="496" y="196" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="576" y="217" text-anchor="middle">Layer n</text>
<rect class="card" x="64"  y="248" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="144" y="269" text-anchor="middle">Layer n + 1</text>
<rect class="card" x="496" y="248" width="160" height="32" rx="6" stroke-width="1"/>
<text class="n ink" x="576" y="269" text-anchor="middle">Layer n + 1</text>

<path class="pr" d="M232 84 L488 84"   stroke-width="1.3" stroke-dasharray="5 4" marker-start="url(#p)" marker-end="url(#p)"/>
<path class="pr" d="M232 136 L488 136" stroke-width="1.3" stroke-dasharray="5 4" marker-start="url(#p)" marker-end="url(#p)"/>
<path class="pr" d="M232 212 L488 212" stroke-width="1.3" stroke-dasharray="5 4" marker-start="url(#p)" marker-end="url(#p)"/>
<text class="lbl prf" x="360" y="78"  text-anchor="middle">protocol</text>
<text class="lbl prf" x="360" y="130" text-anchor="middle">protocol</text>
<text class="lbl prf" x="360" y="206" text-anchor="middle">protocol</text>

<path class="ifc" d="M104 100 L104 120" stroke-width="1.3" marker-start="url(#i)" marker-end="url(#i)"/>
<path class="ifc" d="M104 228 L104 248" stroke-width="1.3" marker-start="url(#i)" marker-end="url(#i)"/>
<path class="ifc" d="M616 100 L616 120" stroke-width="1.3" marker-start="url(#i)" marker-end="url(#i)"/>
<path class="ifc" d="M616 228 L616 248" stroke-width="1.3" marker-start="url(#i)" marker-end="url(#i)"/>
<text class="lbl ifcf" x="116" y="114">interface</text>
<text class="lbl ifcf" x="116" y="242">interface</text>

<path class="line" d="M144 280 L144 300 L576 300 L576 280" fill="none" stroke-width="1.4"/>
<text class="m mut" x="360" y="316" text-anchor="middle">only the bottom layers are physically connected — every protocol above is carried over this one link</text>

<defs>
  <marker id="p" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse">
    <path d="M0,0 L6,3.5 L0,7 Z" fill="context-stroke"/></marker>
  <marker id="i" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto-start-reverse">
    <path d="M0,0 L5,3 L0,6 Z" fill="context-stroke"/></marker>
</defs>
</svg>
