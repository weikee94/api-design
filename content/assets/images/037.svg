<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" width="720" height="276" role="img" aria-labelledby="t d">
<title id="t">CSS becomes the CSSOM, and the CSSOM joins the DOM</title>
<desc id="d">The browser parses HTML into the DOM tree and, in parallel, parses CSS into the CSSOM, the CSS Object Model. The CSS includes rules the initial load never uses, and those are parsed too. The DOM tree and the CSSOM are combined into the layout tree, which is painted so pixels become visible. JavaScript reads and changes styles through the CSSOM. Because unused CSS still goes into the CSSOM, it still costs time before the first paint.</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#c9c9c9}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#9aa0a8}
  .acc{stroke:#0070f3} .accf{fill:#0070f3} .accbg{fill:#eef4ff;stroke:#0070f3}
  .ok{stroke:#1aa179} .okf{fill:#128a66} .okbg{fill:#e8f7f2;stroke:#1aa179}
  .amb{stroke:#e0a040} .ambf{fill:#b87410} .ambbg{fill:#fdf6e8;stroke:#e0a040}
  .bad{stroke:#b5746e} .badf{fill:#a35d57} .badbg{fill:#f6ecea;stroke:#b5746e}
  .vio{stroke:#7c3aed} .viof{fill:#7c3aed} .viobg{fill:#f3eefe;stroke:#7c3aed}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .card{fill:#0b1220;stroke:#475569}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#64748b}
    .acc{stroke:#60a5fa} .accf{fill:#60a5fa} .accbg{fill:#0c2134;stroke:#60a5fa}
    .ok{stroke:#34d399} .okf{fill:#34d399} .okbg{fill:#0b2c31;stroke:#34d399}
    .amb{stroke:#fbbf24} .ambf{fill:#fbbf24} .ambbg{fill:#2e2022;stroke:#fbbf24}
    .bad{stroke:#fb7185} .badf{fill:#fb7185} .badbg{fill:#3f152f;stroke:#fb7185}
    .vio{stroke:#a78bfa} .viof{fill:#a78bfa} .viobg{fill:#1e1638;stroke:#a78bfa}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:11.5px;font-weight:600} .s{font-size:11px} .m{font-size:10px}
</style>
<rect class="bg" width="720" height="276"/>
<text class="h mut" x="24" y="24">CSS BECOMES THE CSSOM · THE CSSOM JOINS THE DOM</text>
<rect class="card" x="24" y="52" width="128" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="88" y="79" text-anchor="middle">HTML</text>
<path class="line" d="M156 74 L236 74" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="196" y="68" text-anchor="middle">parse</text>
<rect class="card" x="240" y="52" width="128" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="304" y="79" text-anchor="middle">DOM tree</text>
<rect class="ambbg" x="24" y="132" width="128" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="88" y="152" text-anchor="middle">CSS</text><text class="m ambf" x="88" y="167" text-anchor="middle">incl. unused rules</text>
<path class="line" d="M156 154 L236 154" stroke-width="1.3" marker-end="url(#a)"/><text class="m mut" x="196" y="148" text-anchor="middle">parse</text>
<rect class="accbg" x="240" y="132" width="128" height="44" rx="8" stroke-width="1.4"/><text class="n ink" x="304" y="152" text-anchor="middle">CSSOM</text><text class="m accf" x="304" y="167" text-anchor="middle">CSS Object Model</text>
<path class="line" d="M368 74 L412 74 L412 106 L448 106" fill="none" stroke-width="1.3" marker-end="url(#a)"/>
<path class="acc" d="M368 154 L412 154 L412 122 L448 122" fill="none" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="card" x="452" y="92" width="120" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="512" y="119" text-anchor="middle">Layout tree</text>
<path class="line" d="M572 114 L608 114" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="612" y="92" width="92" height="44" rx="8" stroke-width="1.2"/><text class="n ink" x="658" y="112" text-anchor="middle">Paint</text><text class="m okf" x="658" y="127" text-anchor="middle">pixels visible</text>
<rect class="viobg" x="24" y="208" width="128" height="36" rx="8" stroke-width="1.2"/><text class="n ink" x="88" y="231" text-anchor="middle">JavaScript</text>
<path class="vio" d="M152 226 L304 226 L304 180" fill="none" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/><text class="m viof" x="232" y="218" text-anchor="middle">reads / changes styles</text>
<text class="m mut" x="24" y="264">unused CSS is still parsed into the CSSOM, so it still costs time before the first paint</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
</svg>
