<path class="line" d="M16 60 L16 56 L104 56 L104 60" fill="none" stroke-width="1"/>
<text class="h viof" x="210" y="48" text-anchor="middle">MIDDLEWARE</text>
<path class="line" d="M116 60 L116 56 L304 56 L304 60" fill="none" stroke-width="1"/>
<text class="h okf" x="510" y="48" text-anchor="middle">SERVER</text>
<path class="line" d="M316 60 L316 56 L704 56 L704 60" fill="none" stroke-width="1"/>
<rect class="accbg" x="16" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="60" y="89" text-anchor="middle">Browser</text>
<text class="m mut" x="60" y="105" text-anchor="middle">HTML, CSS,</text>
<text class="m mut" x="60" y="118" text-anchor="middle">media</text>
<path class="line" d="M106 98 L114 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="viobg" x="116" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="160" y="89" text-anchor="middle">ISP</text>
<text class="m mut" x="160" y="105" text-anchor="middle">DNS cache,</text>
<text class="m mut" x="160" y="118" text-anchor="middle">proxy</text>
<path class="line" d="M206 98 L214 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="viobg" x="216" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="260" y="89" text-anchor="middle">CDN</text>
<text class="m mut" x="260" y="105" text-anchor="middle">static files</text>
<text class="m mut" x="260" y="118" text-anchor="middle">near you</text>
<path class="line" d="M306 98 L314 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="316" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="360" y="89" text-anchor="middle">API gateway</text>
<text class="m mut" x="360" y="105" text-anchor="middle">repeated</text>
<text class="m mut" x="360" y="118" text-anchor="middle">API replies</text>
<path class="line" d="M406 98 L414 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="416" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="460" y="89" text-anchor="middle">Web server</text>
<text class="m mut" x="460" y="105" text-anchor="middle">static</text>
<text class="m mut" x="460" y="118" text-anchor="middle">pages</text>
<path class="line" d="M506 98 L514 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="516" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="560" y="89" text-anchor="middle">App server</text>
<text class="m mut" x="560" y="105" text-anchor="middle">data objects</text>
<text class="m mut" x="560" y="118" text-anchor="middle">in RAM</text>
<path class="line" d="M606 98 L614 98" stroke-width="1.3" marker-end="url(#a)"/>
<rect class="okbg" x="616" y="68" width="88" height="60" rx="8" stroke-width="1.3"/>
<text class="n ink" x="660" y="89" text-anchor="middle">Database</text>
<text class="m mut" x="660" y="105" text-anchor="middle">expensive</text>
<text class="m mut" x="660" y="118" text-anchor="middle">queries</text>
<text class="m viof" x="160" y="150" text-anchor="middle">ISP = your internet provider’s network —</text>
<text class="m viof" x="160" y="163" text-anchor="middle">every request passes through it first</text>
<rect class="card" x="516" y="160" width="188" height="44" rx="8" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="n ink" x="610" y="179" text-anchor="middle">memcached · Redis</text>
<text class="m mut" x="610" y="194" text-anchor="middle">in-memory cache shared by servers</text>
<path class="line" d="M560 160 L560 130 M660 160 L660 130" stroke-width="1" stroke-dasharray="3 3"/>
<text class="m mut" x="24" y="240">every layer that answers from its own copy spares all the layers to its right</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/></marker></defs>
