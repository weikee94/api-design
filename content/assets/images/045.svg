<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" height="256" role="img" aria-labelledby="t d">
<title id="t">Where caches sit between the browser and the database</title>
<desc id="d">A request travels left to right through seven places that can cache. On the client, the browser caches HTML, CSS and media. In the middleware, the ISP — the internet provider whose network every request passes through first — keeps a DNS cache and a proxy, and a CDN serves static files from a location near the user. On the server side, the API gateway caches responses to repeated API calls, the web server caches static pages, the application server caches data objects in RAM, and the database caches the results of expensive queries. Memcached and Redis are in-memory caches shared by the application servers and sit beside the application server and database. Every layer that answers from its own copy spares all the layers after it.</desc>
<style>
