  .bg{fill:#ffffff} .lay{fill:#f4faf7;stroke:#1aa179}
  .hdr{fill:#eef4ff;stroke:#0070f3} .pdu{fill:#ffffff;stroke:#8a8f98}
  .bits{fill:#f4f4f5;stroke:#8a8f98}
  .ink{fill:#111111} .mut{fill:#8a8f98} .line{stroke:#c9c9c9}
  .down{stroke:#0070f3} .up{stroke:#1aa179}
  @media (prefers-color-scheme:dark){
    .bg{fill:#020617} .lay{fill:#0b2c31;stroke:#34d399}
    .hdr{fill:#0c2134;stroke:#60a5fa} .pdu{fill:#0b1220;stroke:#94a3b8}
    .bits{fill:#0f172a;stroke:#94a3b8}
    .ink{fill:#ffffff} .mut{fill:#94a3b8} .line{stroke:#475569}
    .down{stroke:#60a5fa} .up{stroke:#34d399}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif}
  .h{font-size:11px;font-weight:600;letter-spacing:.08em}
  .n{font-size:10.5px;font-weight:600} .m{font-size:9.5px} .bit{font-size:10px;font-family:ui-monospace,monospace}
</style>
