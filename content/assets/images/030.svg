<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384"
     role="img" aria-labelledby="t d">
<title id="t">The OSI model — each layer adds its own header on the way down, and they are stripped on the way up</title>
<desc id="d">On the sender side the message passes down the seven OSI layers. The application layer holds the data. Presentation adds PH, session adds SH, transport adds TH, network adds NH, and the data link layer adds both a header DH and a trailer DT. The physical layer turns the whole thing into a bit stream. On the receiver side the same seven layers run upward and each removes the header its peer added. The block therefore grows wider at every step down and narrower at every step up, which is what encapsulation means.</desc>
